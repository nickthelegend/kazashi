<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0e0d" />
    <title>Kazashi</title>
    <style>
      :root { --sumi: #0f0e0d; --vermilion: #b83a22; --lamp: #ffd08a; --paper: #f3ead7; }
      html, body { margin: 0; height: 100%; background: var(--sumi); color: var(--paper); }
      body { font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden; }
      #scene-container { position: fixed; inset: 0; }
      #intro {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        background: radial-gradient(circle at 50% 38%, rgba(255, 208, 138, 0.22), transparent 55%), var(--sumi);
        z-index: 2;
      }
      body.in-xr #intro { display: none; }
      .card {
        width: min(440px, 100%); box-sizing: border-box; padding: 28px 24px;
        border: 10px solid var(--vermilion); background: var(--paper); color: var(--sumi);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .kicker { font-family: 'Anonymous Pro', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { font-size: clamp(40px, 12vw, 64px); line-height: 0.95; margin: 10px 0 12px; font-weight: 800; }
      p { font-size: 17px; line-height: 1.45; margin: 0 0 18px; }
      button {
        font: 800 18px 'Bricolage Grotesque', system-ui, sans-serif; color: var(--paper); background: var(--sumi);
        border: 0; padding: 14px 20px; width: 100%; cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button:focus-visible { outline: 3px solid var(--vermilion); outline-offset: 3px; }
      #status { font-family: 'Anonymous Pro', ui-monospace, monospace; font-size: 14px; margin: 14px 0 0; min-height: 2.6em; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="intro">
      <div class="card">
        <div class="kicker">Kazashi · a shadow theatre for your room</div>
        <h1>Hold your hands to the light.</h1>
        <p>Your hand's shadow falls on your real wall. Shape a dog and it comes alive, runs along the wall and leaps the corner. Collect the cast, then stage a 20-second play.</p>
        <button id="enter" disabled>Enter the theatre</button>
        <p id="status" role="status">Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
